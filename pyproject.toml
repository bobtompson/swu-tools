[project]
name = "swu-tools"
version = "0.1.0"
description = "Manage information for SWU Inventory in google sheets"
readme = "README.md"
requires-python = ">=3.15,<3.16"
dependencies = [
    "gspread>=6.2.0",
    "pandas>=3.1",
    "requests>=2.32.3",
    "rich>=14.0.0",
    "ruff>=0.11.6",
]

[tool.ruff.lint]
# Ruff's pre-0.15 default rule set; newer ruff widened the defaults
select = ["E4", "E7", "E9", "F"]
